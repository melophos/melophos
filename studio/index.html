<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MELOPHOS Studio: light-guided practice in the browser" />
    <title>MELOPHOS Studio</title>
  </head>
  <body>
    <header>
      <h1>MELOPHOS Studio</h1>
      <button id="connect" type="button">Connect MIDI device</button>

        <div id="keyboard" class="keyboard"></div>

      <p id="last-note" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
