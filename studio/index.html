<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MELOPHOS Studio: light-guided practice in the browser" />
    <link rel="icon" href="/melophos-mark-transparent.svg" type="image/svg+xml" />
    <title>MELOPHOS Studio</title>
  </head>
  <body>
    <header class="topbar">
      <img src="/melophos-wordmark-dark.svg" alt="MELOPHOS" class="wordmark" width="150" height="50" />
      <span class="product">Studio</span>
      <div class="connect">
        <p id="status" role="status" aria-live="polite">No MIDI device</p>
        <button id="connect" type="button" class="secondary">Connect MIDI device</button>
      </div>
    </header>

    <main>
      <section class="panel practice" aria-labelledby="song-title">
        <div class="song">
          <label for="song" class="label">Song</label>
          <select id="song"></select>
          <h1 id="song-title"></h1>
          <p id="composer" class="muted"></p>
        </div>
        <div class="next">
          <span class="label">Next note</span>
          <p id="next-note" class="next-note" aria-live="polite">-</p>
          <p id="progress" class="muted"></p>
        </div>
        <div class="actions">
          <span class="label">Melody mode</span>
          <button id="demo" type="button">Play demo</button>
          <button id="reset" type="button" class="secondary">Start again</button>
        </div>
      </section>

      <section class="panel instrument" aria-label="Keyboard with guide lights">
        <div id="keyboard" class="keyboard"></div>
        <p id="feedback" class="feedback" role="status" aria-live="polite">The amber light shows the next note to play.</p>
      </section>

      <section id="summary" class="panel summary" aria-labelledby="summary-title" hidden>
        <h2 id="summary-title">Practice summary</h2>
        <dl>
          <div><dt>Accuracy</dt><dd id="s-accuracy"></dd></div>
          <div><dt>Notes played</dt><dd id="s-notes"></dd></div>
          <div><dt>Average timing</dt><dd id="s-timing"></dd></div>
          <div><dt>Best streak</dt><dd id="s-streak"></dd></div>
        </dl>
      </section>

      <p class="muted small">The demo plays the song with a simulated player. Connect a MIDI keyboard to practise yourself.</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
