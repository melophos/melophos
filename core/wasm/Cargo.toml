[package]
name = "melophos-core-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "WebAssembly bindings for the MELOPHOS scoring engine"
license = "AGPL-3.0-or-later"
repository = "https://github.com/melophos/melophos"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
melophos-core = { path = ".." }
# the build script installs the matching command line tool: the two versions must be equal
wasm-bindgen = "=0.2.129"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
