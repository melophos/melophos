# Hubs publish to melophos/<device_id>/<notes|session|status>, see docs/protocol.md.
# Every client signs in. Access is decided by the dynamic security plugin, whose rules the server writes:
# a hub may publish only under its own id and may subscribe to nothing.
# the listeners (plain on 1883 and TLS on 8883) are written by start.sh from what is mounted, see README.md
# the server's queue and session are kept on disk, so they survive a broker restart too
persistence true
persistence_location /mosquitto/data/
allow_anonymous false
allow_zero_length_clientid false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# a hub's messages are not kept: nothing is retained and little is queued
retain_available false
max_inflight_messages 20
# what the broker keeps for the server while it is away: 20 000 messages or 64 MiB, whichever comes first. Beyond
# that the broker drops the newest
max_queued_messages 20000
max_queued_bytes 67108864

# the listeners come last, so the settings above are global and no listener is created before start.sh asks for it.
# each listener carries its own size and connection limits, because those are per listener
include_dir /mosquitto/conf.d
