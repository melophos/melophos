# throwaway services for the test suite. Never the development stack: own project name, own ports, no volumes.
# Start with `docker compose -p melophos-server -f tests/infra/compose.yml up -d --wait` from server/.
# Stop with `... down -v`. The credentials below only exist inside this disposable container.

name: melophos-server

services:
  testdb:
    image: timescale/timescaledb:2.32.1-pg17@sha256:2f5e6969faa5cd7f4b075d65f124e30dc50d456b7b807e5c1acd9d51ba7df51c
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-only
    ports:
      - "127.0.0.1:25432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  testbroker:
    build: ../../deploy/mosquitto
    environment:
      MQTT_ADMIN_USERNAME: admin
      MQTT_ADMIN_PASSWORD: test-admin-only-0123456789
    ports:
      - "127.0.0.1:21883:1883"
    tmpfs:
      - /mosquitto/data:uid=1883,gid=1883
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_ctrl -i healthcheck -h 127.0.0.1 -p 1883 -u admin -P test-admin-only-0123456789 dynsec listRoles"]
      interval: 2s
      retries: 30
