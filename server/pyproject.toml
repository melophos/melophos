[project]
name = "melophos-server"
version = "0.1.0"
description = "MELOPHOS server: practice sessions, note events, song import and integrations"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "prometheus-client>=0.23",
    "psycopg[binary,pool]>=3.2",
    "argon2-cffi>=23.1",
    "cryptography>=45",
    "paho-mqtt>=2.1",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "jsonschema>=4.25",
    "ruff>=0.14",
    "mypy>=1.18",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# the formatter wraps code at 110, long strings and comments are left to the writer
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "no_clean: leave the tables alone, the test makes its own database",
    "slow: takes more than a few seconds",
]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["app", "worker"]

[tool.ruff.lint.per-file-ignores]
# test data and SQL strings read better on one line
"tests/*" = ["E501"]
