name: Publish images

# builds the server and broker images for amd64 and arm64 (the Raspberry Pi 5 is arm64). It signs them without a stored
# key and attaches build provenance and a software bill of materials. Then it prepares the release files for the
# one-command install. It runs only for a version tag in the real repository. It never runs for a branch, a fork or a
# pull request. The release it creates is a DRAFT that a maintainer publishes by hand. It cannot run until the
# repository is pushed, so nothing here has run yet. The tag ruleset and the protected release environment are
# repository settings made before the first tag, because a workflow cannot defend itself against an edit at the tagged
# commit.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# nothing by default: each job asks for what it needs
permissions: {}

# a release is never cancelled half way
concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Release gate
    if: github.repository == 'melophos/melophos' && github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # to see that CI passed on this commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag, the commit, CI and the version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: .github/scripts/verify-release.sh

  # the protected `release` environment asks its required reviewers before anything below this job runs
  approve:
    name: Maintainer approval
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions: {}
    steps:
      - run: echo "approved through the release environment"

  build:
    name: Build ${{ matrix.image }} ${{ matrix.platform }}
    needs: [verify, approve]
    # each platform is built on a machine of its own architecture: the Rust engine is slow under emulation
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # the only jobs that may push images are this one and the merge job
    strategy:
      fail-fast: true
      matrix:
        include:
          - {image: server, platform: linux/amd64, runner: ubuntu-24.04, arch: amd64, context: server, contexts: "core=core"}
          - {image: server, platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64, context: server, contexts: "core=core"}
          - {image: mqtt, platform: linux/amd64, runner: ubuntu-24.04, arch: amd64, context: server/deploy/mosquitto, contexts: ""}
          - {image: mqtt, platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64, context: server/deploy/mosquitto, contexts: ""}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: epoch
        name: The time of the commit, for the server's clock check
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          build-contexts: ${{ matrix.contexts }}
          build-args: ${{ matrix.image == 'server' && format('BUILD_EPOCH={0}', steps.epoch.outputs.epoch) || '' }}
          platforms: ${{ matrix.platform }}
          # pushed by digest with no tag: the merge job makes the tag and the one manifest list
          outputs: type=image,name=ghcr.io/melophos/melophos-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge and sign ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # the only other job that may push images
      id-token: write # keyless signing and provenance
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        image: [server, mqtt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4 # the install script needs a client that reads what this version writes
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/melophos/melophos-${{ matrix.image }}
          flavor: latest=false # no image is ever tagged latest
          tags: type=semver,pattern={{version}}
      # the digest is taken from the creation of the index and checked against the platform builds, never read back
      # through a tag (see .github/scripts/merge-images.sh)
      - id: digest
        name: Make one image of both platforms
        env:
          IMAGE: ghcr.io/melophos/melophos-${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST_DIR: ${{ runner.temp }}/digests
          EXPECTED: "2"
          NAME: ${{ matrix.image }}
        run: |
          digest="$(.github/scripts/merge-images.sh)"
          echo "$digest" > "$RUNNER_TEMP/digest-$NAME.txt"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # the digest is what is signed and what the compose file pins, so a tag moving later changes nothing
      - name: Sign the image
        env:
          REF: ghcr.io/melophos/melophos-${{ matrix.image }}@${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "$REF"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/melophos/melophos-${{ matrix.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}
          path: ${{ runner.temp }}/digest-${{ matrix.image }}.txt
          if-no-files-found: error
          retention-days: 1

  files:
    name: Release files
    needs: merge
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # to sign the checksums and attest the files
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/merged
          merge-multiple: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Pin the release files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          server/deploy/pin-release.sh --version "$TAG" \
            --server-digest "$(cat "$RUNNER_TEMP/merged/digest-server.txt")" \
            --mqtt-digest "$(cat "$RUNNER_TEMP/merged/digest-mqtt.txt")" \
            --out release-files
      # a bundle of the checksums file, signed by this workflow run: a second way to check them without the GitHub tool
      - name: Sign the checksums
        working-directory: release-files
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      # the build provenance of every file: `gh attestation verify install.sh` checks the one that matters most
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-files/install.sh
            release-files/docker-compose.yml
            release-files/env.example
            release-files/generate-env.sh
            release-files/backup.sh
            release-files/restore.sh
            release-files/prometheus.yml
            release-files/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release-files
          if-no-files-found: error
          retention-days: 1

  release:
    name: Draft the release
    needs: files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # to create the draft and nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      # a draft: nobody is sent to it until a maintainer has read it and published it
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release-files/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --draft --verify-tag
