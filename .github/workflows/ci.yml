name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # a newer push cancels an older run of a branch, never a run on main: each commit on main keeps its own result
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  core:
    name: Core (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # builds the scoring engine to WebAssembly and runs the same fixtures through Node.
  # the tool version below must equal the wasm-bindgen entry in core/Cargo.lock: the build script checks it
  core-wasm:
    name: Core (WebAssembly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add wasm32-unknown-unknown
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p melophos-core-wasm --all-targets -- -D warnings
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: bindgen
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-0.2.129-${{ runner.os }}
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
        if: steps.bindgen.outputs.cache-hit != 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: core/wasm/package/package-lock.json
      - run: npm ci
        working-directory: core/wasm/package
      - run: sh wasm/build.sh
      - run: npm run typecheck && npm test
        working-directory: core/wasm/package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: melophos-core-wasm
          path: |
            core/wasm/package/dist
            core/wasm/package/pkg
          if-no-files-found: error

  # builds the scoring engine as a Python wheel with maturin and runs the shared fixtures through it.
  # the wheel is abi3, so one build serves both Python versions the server supports
  core-python:
    name: Core (Python module ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add clippy
      - run: cargo clippy --locked -p melophos-core-python --all-targets -- -D warnings
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "maturin>=1.7,<2" pytest
      - run: maturin build --release --locked --manifest-path python/Cargo.toml
      - run: pip install --no-index --find-links target/wheels melophos-core
      - run: pytest -q
        working-directory: core/python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.python == '3.12'
        with:
          name: melophos-core-wheel
          path: core/target/wheels/*.whl
          if-no-files-found: error

  firmware:
    name: Firmware (PlatformIO)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      # keeps the compiled objects between runs, so the framework is not rebuilt from scratch every time.
      # PlatformIO still recompiles anything whose source changed, so a stale entry cannot pass a broken build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: firmware/.pio
          key: pio-build-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}-${{ hashFiles('firmware/src/**', 'firmware/include/**', 'firmware/lib/**', 'firmware/test/**') }}
          restore-keys: |
            pio-build-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}-
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio test -e native
      # the same tests under the sanitizers (with a short fuzz run) and the release configuration
      - run: pio test -e native-sanitize
      - run: pio test -e native-release
      - run: pio test -e native-bringup
      - run: pio test -e native-tsan -f test_threads
      - run: pip install jsonschema pydantic
      - run: python ../profiles/check_profiles.py
      - run: python test/contract_check.py
      - run: pio run -e esp32-s3 -e esp32-bringup -e esp32-s3-release -e esp32-bringup-release

  # 3.12 is the minimum in pyproject.toml and 3.14 is what the server image ships, so both are proved on every change
  server:
    needs: core-python
    name: Server (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      # the image installs from hashed lock files: they must say what pyproject.toml says, made by the pinned uv
      - if: matrix.python == '3.12'
        run: |
          pip install uv==0.13.9
          ./lock-requirements.sh
          git diff --exit-code -- requirements.lock requirements-build.lock requirements-engine.lock
      # the engine's wheel, built once by the Core (Python module) job on 3.12. It is a stable-ABI wheel that runs on
      # every Python from 3.9, so one build serves both entries of this matrix and nothing is built per version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: melophos-core-wheel
          path: core-wheel
      - run: pip install ../core-wheel/*.whl
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # the safety tests need age (the encrypted backups) and actionlint. Each is a pinned release checked against a
      # checksum. shellcheck, docker and gh are on the runner
      - name: Install the tools the safety tests need
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          curl -sSfL -o age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  age.tar.gz" | sha256sum -c -
          tar -xzf age.tar.gz
          sudo install -m 755 age/age age/age-keygen /usr/local/bin/
          curl -sSfL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 755 actionlint /usr/local/bin/
      # the tests use a real Postgres with TimescaleDB and a real Mosquitto, never a fake
      - run: docker compose -p melophos-server -f tests/infra/compose.yml up -d --build --wait
      # a safety test that is skipped fails here, so a missing tool can never pass unnoticed
      - run: pytest
        env:
          MELOPHOS_REQUIRE_SAFETY_TESTS: "1"
          GH_TOKEN: ${{ github.token }}
      - if: always()
        run: docker compose -p melophos-server -f tests/infra/compose.yml down -v
      # the image installs the same wheel and refuses to build without it
      - if: matrix.python == '3.12'
        run: |
          mkdir -p wheels
          cp ../core-wheel/*.whl wheels/
          docker build -t melophos-server:ci .

  client:
    name: Client (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  studio:
    name: Studio (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      # the Studio depends on the scoring engine package in core/, so it is built before npm ci reads the file dependency
      - run: rustup target add wasm32-unknown-unknown
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: bindgen
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-0.2.129-${{ runner.os }}
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
        if: steps.bindgen.outputs.cache-hit != 'true'
      - run: npm ci
        working-directory: core/wasm/package
      - run: sh wasm/build.sh
        working-directory: core
      - run: npm ci
      - run: npm test
      - run: npm run build

  # contrast, colour vision, product rules and the font glyph check are Vitest files, so the job above already runs them with npm test
  studio-licences:
    name: Studio (licences)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      # the Studio depends on the scoring engine package in core/, so it is built before npm ci reads the file dependency
      - run: rustup target add wasm32-unknown-unknown
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: bindgen
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-0.2.129-${{ runner.os }}
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
        if: steps.bindgen.outputs.cache-hit != 'true'
      - run: npm ci
        working-directory: core/wasm/package
      - run: sh wasm/build.sh
        working-directory: core
      - run: npm ci
      - run: npm run check:licences

  studio-browser:
    name: Studio (browser checks)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      # the Studio depends on the scoring engine package in core/, so it is built before npm ci reads the file dependency
      - run: rustup target add wasm32-unknown-unknown
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: bindgen
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-0.2.129-${{ runner.os }}
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
        if: steps.bindgen.outputs.cache-hit != 'true'
      - run: npm ci
        working-directory: core/wasm/package
      - run: sh wasm/build.sh
        working-directory: core
      - run: npm ci
      # the browser download is keyed on the lockfile, so it is fetched again only when Playwright changes
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('studio/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
      - run: npm run check:a11y
      - run: npm run check:lighthouse
      - run: npm run specimen:shots
        env:
          SHOTS_DIR: specimen-screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: specimen-screenshots
          path: |
            studio/specimen-screenshots
            studio/.lighthouseci
            studio/test-results
          if-no-files-found: ignore
          retention-days: 14

  discord:
    name: Discord (ruff, pytest, worker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
        working-directory: discord
      # no secret is needed: the tests talk to servers on 127.0.0.1 and nothing else
      - name: Lint and test
        working-directory: discord
        run: |
          ruff check .
          pytest
          python -m serverkit check --layout layout/melophos.toml
          python -m serverkit export-content --check --layout layout/melophos.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: discord/worker/package-lock.json
      - name: Worker tests and type check
        working-directory: discord/worker
        run: |
          npm ci
          npm test
          npm run typecheck

  # the public site builds from the whole repository, so these jobs check out all of it.
  # the production build is not run here: it fails on purpose until the owner fills the placeholders
  site:
    name: Site (types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:licences

  site-browser:
    name: Site (browser checks)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
      # Lighthouse drives the same Chromium that Playwright installed, so the run does not depend on what the runner image ships
      - name: Point Lighthouse at the installed Chromium
        run: echo "CHROME_PATH=$(node --input-type=module -e "import('@playwright/test').then((m) => console.log(m.chromium.executablePath()))")" >> "$GITHUB_ENV"
      - run: npm run check:a11y
      - run: npm run check:lighthouse

  # ── Alert staff when main breaks ─────────────────────────────────────────────
  # the last job: it runs only when a job above failed on a push to main of this repository, so a
  # pull request and a fork never reach the webhook. the alert holds the run number and a link and
  # nothing from a log
  ci-alert:
    name: CI alert
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'melophos/melophos'
    needs:
      - core
      - core-wasm
      - core-python
      - firmware
      - server
      - client
      - studio
      - studio-licences
      - studio-browser
      - discord
      - site
      - site-browser
    environment: community
    permissions:
      contents: read

    steps:
      - name: Check out the poster
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: discord
          fetch-depth: 1

      - name: Post the alert
        env:
          DISCORD_WEBHOOK_CI_ALERTS: ${{ secrets.DISCORD_WEBHOOK_CI_ALERTS }}
        run: python3 discord/relay/post.py --layout discord/layout/melophos.toml --ci-failure
