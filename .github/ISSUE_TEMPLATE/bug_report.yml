name: Bug report
description: Something in MELOPHOS does not work as documented.
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Firmware (hub)
        - Hardware (boards, bars, enclosures)
        - Core (scoring engine)
        - Server
        - Studio
        - Client or simulator
        - Profiles
        - Docs
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error message or log output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect the keyboard over USB-C
        2. Play middle C
        3. ...
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Hardware and versions
      description: Hub revision or development board, instrument model, how it connects, firmware or commit.
      placeholder: ESP32-S3-DevKitC-1, 88-key keyboard over USB-MIDI, firmware 0.1.0
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for this problem.
          required: true
        - label: I have read the [Code of Conduct](https://github.com/melophos/melophos/blob/main/CODE_OF_CONDUCT.md).
          required: true
