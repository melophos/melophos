version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "18:00"
      timezone: Europe/London
    labels: [dependencies]
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories: [/server, /client]
    schedule:
      interval: weekly
      day: sunday
      time: "18:00"
      timezone: Europe/London
    labels: [dependencies]
    commit-message:
      prefix: chore
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /studio
    schedule:
      interval: weekly
      day: sunday
      time: "18:00"
      timezone: Europe/London
    labels: [dependencies, studio]
    commit-message:
      prefix: chore
    groups:
      studio-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: weekly
      day: sunday
      time: "18:00"
      timezone: Europe/London
    labels: [dependencies, core]
    commit-message:
      prefix: chore
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
      day: sunday
      time: "18:00"
      timezone: Europe/London
    labels: [dependencies, server]
    commit-message:
      prefix: chore
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker-compose
    directory: /server/deploy
    schedule:
      interval: weekly
      day: sunday
      time: "18:00"
      timezone: Europe/London
    labels: [dependencies, server]
    commit-message:
      prefix: chore
    groups:
      docker-compose-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
