title: "[Research] "
labels: ["research"]
body:
  - type: textarea
    id: topic
    attributes:
      label: The question or finding
      description: What you want to find out or what you found, for example a feedback approach, a latency limit or an accessibility finding.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Papers, datasets or repositories behind it, with links.
  - type: textarea
    id: relevance
    attributes:
      label: Why it matters for MELOPHOS
      description: The part of the hub, the Studio or the scoring it would change or confirm.
