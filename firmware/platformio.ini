; MELOPHOS hub firmware.
; esp32-s3 builds the real hub. esp32-bringup targets a classic ESP32 dev board
; (LEDs, MIDI jack, Bluetooth and Wi-Fi, but no USB host). native runs the unit
; tests on the host, which is why lib/ never includes Arduino headers.

[platformio]
default_envs = esp32-s3

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    fastled/FastLED@^3.10.3
build_flags =
    -D MELOPHOS_HUB_REV=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_flags = -Wall -Wextra -Werror
test_ignore = *

[env:esp32-bringup]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    fastled/FastLED@^3.10.3
; GPIO 6 to 11 drive the flash chip on classic ESP32 modules, so MIDI TX moves
build_flags =
    -D MELOPHOS_HUB_REV=-1
    -D PIN_MIDI_TX=19
build_src_flags = -Wall -Wextra -Werror
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -Werror
