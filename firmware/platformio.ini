; MELOPHOS hub firmware.
; esp32-s3 builds the real hub. esp32-bringup targets a classic ESP32 dev board
; (LEDs, MIDI jack, Bluetooth and Wi-Fi, but no USB host). native runs the unit
; tests on the host, which is why lib/ never includes Arduino headers.

[platformio]
default_envs = esp32-s3

[env:esp32-s3]
; exact versions, so a build today and a build in a year are the same code
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
lib_deps =
    fastled/FastLED@3.10.10
    h2zero/NimBLE-Arduino@2.5.2
build_flags =
    -D MELOPHOS_HUB_REV=0
    -D SENSE_VIN_FITTED=1
    ; the console is UART0 (GPIO 43 and 44) through the CH340C bridge. The chip's one USB PHY belongs to the
    ; keyboard host, so the USB serial console is off. Awaits a board.
    -D ARDUINO_USB_CDC_ON_BOOT=0
build_src_flags = -Wall -Wextra -Werror
test_ignore = *

[env:esp32-bringup]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
lib_deps =
    fastled/FastLED@3.10.10
    h2zero/NimBLE-Arduino@2.5.2
; GPIO 6 to 11 drive the flash chip on classic ESP32 modules and GPIO 1 and 3 are the console, so this board
; has its own pin set. The hub's host port, audio clock and sense lines do not exist on it. It is a development
; kit with the strip on a bench supply, so there is no inlet to sense (MELOPHOS_BENCH_SUPPLY)
build_flags =
    -D MELOPHOS_HUB_REV=-1
    -D MELOPHOS_BENCH_SUPPLY=1
    -D PIN_MIDI_TX=19
    -D PIN_SENSE_5V=34
    -D PIN_STATUS_LED=2
    -D PIN_I2C_SDA=21
    -D PIN_I2C_SCL=22
    -D PIN_HOST_EN=-1
    -D PIN_HOST_FAULT=-1
    -D PIN_HOST_CC1=-1
    -D PIN_HOST_CC2=-1
    -D PIN_I2S_MCLK=-1
    -D PIN_LED_AUX=-1
    -D PIN_BUZZER=-1
    -D PIN_ENC_A=-1
    -D PIN_ENC_B=-1
    -D PIN_ENC_SW=-1
    -D MELOPHOS_GUARD_LEDS=180
    -D MELOPHOS_AUX_LEDS_MAX=0
build_src_flags = -Wall -Wextra -Werror
test_ignore = *

; release builds of both boards: -D MELOPHOS_RELEASE removes the plain MQTT path and the `provision insecure`
; command from the binary. These are the images to ship
[env:esp32-s3-release]
extends = env:esp32-s3
build_flags =
    ${env:esp32-s3.build_flags}
    -D MELOPHOS_RELEASE

[env:esp32-bringup-release]
extends = env:esp32-bringup
build_flags =
    ${env:esp32-bringup.build_flags}
    -D MELOPHOS_RELEASE

[env:native]
platform = native
test_framework = unity
test_ignore = test_release, test_pins_bringup
build_flags = -std=gnu++17 -Wall -Wextra -Werror

; the same tests under AddressSanitizer and UndefinedBehaviourSanitizer. Any
; finding aborts the run: pio test -e native-sanitize
[env:native-sanitize]
platform = native
test_framework = unity
test_ignore = test_release, test_pins_bringup
build_flags = -std=gnu++17 -Wall -Wextra -Werror -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all

; the release configuration: the plain MQTT path must not exist
[env:native-release]
platform = native
test_framework = unity
test_filter = test_release
build_flags = -std=gnu++17 -Wall -Wextra -Werror -D MELOPHOS_RELEASE

; the host tests under ThreadSanitizer: the queue and the status are shared between the main loop and
; the network task on the board and test_threads drives them from two threads
[env:native-tsan]
platform = native
test_framework = unity
test_ignore = test_release, test_pins_bringup
build_flags = -std=gnu++17 -Wall -Wextra -Werror -O1 -g -fno-omit-frame-pointer -fsanitize=thread

; the bring-up board's pin set and power rule, checked on the host with the flags the board build uses
[env:native-bringup]
platform = native
test_framework = unity
test_filter = test_pins_bringup
build_flags = -std=gnu++17 -Wall -Wextra -Werror -D MELOPHOS_HUB_REV=-1 -D MELOPHOS_BENCH_SUPPLY=1 -D PIN_MIDI_TX=19 -D PIN_SENSE_5V=34 -D PIN_STATUS_LED=2 -D PIN_I2C_SDA=21 -D PIN_I2C_SCL=22 -D PIN_HOST_EN=-1 -D PIN_HOST_FAULT=-1 -D PIN_HOST_CC1=-1 -D PIN_HOST_CC2=-1 -D PIN_I2S_MCLK=-1 -D PIN_LED_AUX=-1 -D PIN_BUZZER=-1 -D PIN_ENC_A=-1 -D PIN_ENC_B=-1 -D PIN_ENC_SW=-1 -D MELOPHOS_GUARD_LEDS=180 -D MELOPHOS_AUX_LEDS_MAX=0
